name: Wezel assigned run

# Fiflok dispatches one exact run through this repository's Wezel GitHub App
# installation. WEZEL_RUNNER_TOKEN is the runner-scoped token created for this
# GitHub Actions runner.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Fiflok run ID
        required: true
        type: string
      experiment_name:
        description: Experiment to run
        required: true
        type: string
      commit_sha:
        description: Assigned commit
        required: true
        type: string
      project_dir:
        description: Directory containing the Wezel project
        required: true
        type: string

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: wezel-run-${{ inputs.run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha }}
      - uses: wezel-build/gh-action@v1.0.1
        with:
          token: ${{ secrets.WEZEL_RUNNER_TOKEN }}
          run-id: ${{ inputs.run_id }}
          experiment-name: ${{ inputs.experiment_name }}
          project-dir: ${{ inputs.project_dir }}
